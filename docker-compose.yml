services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: votos
      POSTGRES_USER: votos
      POSTGRES_PASSWORD: votos
    ports:
      - "5432:5432"
    volumes:
      - votos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votos"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  votos_pgdata:
